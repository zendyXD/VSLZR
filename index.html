<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSLZR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050507; color:#eee; font-family:sans-serif; overflow:hidden; height:100vh; }

  /* the stage = everything that gets recorded (full screen, or a 9:16 phone shape) */
  #stage { position:fixed; top:0; bottom:0; left:50%; width:100%; transform:translateX(-50%); overflow:hidden; }
  body.portrait #stage { width:min(100vw, calc(100vh * 9 / 16)); background:#050507; box-shadow:0 0 0 1px #222; }

  .bgm { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .5s; pointer-events:none; }
  .bgm.show { opacity:.42; }
  #cover.show { opacity:1; }   /* blurred + dimmed cover is pre-rendered, so it can be full strength */

  #glow { position:absolute; left:50%; top:52%; width:90vmin; height:90vmin; margin:-45vmin 0 0 -45vmin; border-radius:50%;
          background:radial-gradient(circle, rgba(120,60,255,.55), rgba(120,60,255,0) 65%);
          opacity:.15; will-change:transform, opacity; pointer-events:none; }

  /* round cover in the middle of the circle style */
  #disc { position:absolute; left:50%; top:52%; width:200px; height:200px; border-radius:50%; object-fit:cover;
          transform:translate(-50%,-50%); opacity:0; transition:opacity .5s; pointer-events:none; will-change:transform;
          box-shadow:0 0 40px var(--dg, rgba(120,60,255,.5)); }
  #disc.show { opacity:1; }

  canvas#c { position:absolute; inset:0; width:100%; height:100%; }
  #title { position:absolute; left:50%; top:9%; transform:translate(-50%,-50%);
           font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight:800;
           font-size:60px; letter-spacing:.22em; text-indent:.22em; white-space:nowrap;
           background:linear-gradient(90deg, var(--t1, #fff), var(--t2, #b99bff));
           -webkit-background-clip:text; background-clip:text;
           color:transparent; -webkit-text-fill-color:transparent;
           filter:drop-shadow(0 0 18px var(--tg, rgba(120,60,255,.55)));
           pointer-events:none; will-change:transform; }

  #hint { position:fixed; top:60%; left:50%; transform:translateX(-50%); opacity:.4; letter-spacing:4px; font-size:13px; pointer-events:none; text-align:center; }
  #list { position:fixed; top:16px; left:16px; font-size:12px; letter-spacing:2px; opacity:.85; max-height:55vh; overflow:auto; z-index:5; }
  #list div { display:flex; align-items:center; gap:10px; cursor:pointer; padding:5px 10px; border-radius:6px; min-width:230px; }
  #list div:hover { background:rgba(255,255,255,.08); }
  #list div.on { color:#b99bff; background:rgba(155,107,255,.12); }
  #list .n { opacity:.6; min-width:22px; }
  #list div.on .n { opacity:1; }
  #list .nm { flex:1; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .x { opacity:.3; padding:2px 7px; border-radius:4px; font-size:11px; letter-spacing:0; }
  #list div:hover .x { opacity:.7; }
  #list .x:hover { opacity:1; color:#ff5c7a; background:rgba(255,92,122,.15); }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:24px; display:flex; flex-direction:column; align-items:center; gap:12px;
        background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  #track { letter-spacing:5px; font-weight:300; font-size:14px; opacity:.85; min-height:18px; }
  #seek { width:min(600px, 90%); accent-color:#9b6bff; }
  #vol { width:80px; accent-color:#9b6bff; }
  #keys { font-size:11px; letter-spacing:2px; opacity:.3; text-align:center; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button, label.btn { background:none; border:1px solid #444; color:#eee; padding:10px 18px; border-radius:30px; cursor:pointer; font-size:14px; }
  button:hover, label.btn:hover { border-color:#fff; }
  button.on { border-color:#9b6bff; color:#b99bff; }
  button.rec { border-color:#ff3b5c; color:#ff3b5c; }
  input[type=file] { display:none; }
  #drop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,5,7,.82);
          border:2px dashed #9b6bff; letter-spacing:8px; font-size:18px; z-index:50; pointer-events:none; text-align:center; }
  body.dragging #drop { display:flex; }
  body.clean #ui, body.clean #list, body.clean #hint { display:none; }
</style>
</head>
<body>

<div id="stage">
  <video id="audio" class="bgm" playsinline></video>
  <img id="cover" class="bgm" alt="">
  <div id="glow"></div>
  <img id="disc" alt="">
  <canvas id="c"></canvas>
  <div id="title">VSLZR</div>
</div>

<div id="hint">LOAD OR DROP YOUR BEATS (MP3 OR MP4) TO BEGIN</div>
<div id="list"></div>
<div id="drop">DROP BEATS (MP3 / MP4) OR A COVER IMAGE</div>

<div id="ui">
  <div id="track"></div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="row">
    <label class="btn" for="files">Load beats</label>
    <input type="file" id="files" accept="audio/*,video/*" multiple>
    <label class="btn" for="coverFile">Cover</label>
    <input type="file" id="coverFile" accept="image/*">
    <button id="presetsBtn">Try presets</button>
    <button id="prev">&#9664;&#9664;</button>
    <button id="play">Play</button>
    <button id="next">&#9654;&#9654;</button>
    <button id="shuffleBtn">Shuffle</button>
    <button id="modeBtn">bars</button>
    <button id="themeBtn">theme</button>
    <button id="fmtBtn">16:9</button>
    <button id="recBtn">&#9679; Record</button>
    <button id="fs">Fullscreen</button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" title="Volume">
  </div>
  <div id="keys">SPACE PLAY &nbsp;·&nbsp; M STYLE &nbsp;·&nbsp; T THEME &nbsp;·&nbsp; S SHUFFLE &nbsp;·&nbsp; V BACKGROUND &nbsp;·&nbsp; C CLEAR COVER &nbsp;·&nbsp; H HIDE UI &nbsp;·&nbsp; 1-9 PICK BEAT &nbsp;·&nbsp; ← → SEEK</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const audio = document.getElementById('audio');       // a <video> element: plays mp3 AND mp4
  const coverEl = document.getElementById('cover');
  const disc = document.getElementById('disc');
  const playBtn = document.getElementById('play');
  const modeBtn = document.getElementById('modeBtn');
  const themeBtn = document.getElementById('themeBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const recBtn = document.getElementById('recBtn');
  const fmtBtn = document.getElementById('fmtBtn');
  const seek = document.getElementById('seek');
  const volEl = document.getElementById('vol');
  const trackName = document.getElementById('track');
  const hint = document.getElementById('hint');
  const listEl = document.getElementById('list');
  const title = document.getElementById('title');
  const glow = document.getElementById('glow');
  const presetsBtn = document.getElementById('presetsBtn');

  const CY = 0.52;   // vertical center of the circle / wave / tunnel / glow (title sits above it)

  // ---------- stage + canvas size (capped for speed) ----------
  let stageW = innerWidth, stageH = innerHeight;
  let scale = Math.min(1, 1280 / innerWidth);
  let W, H;

  function isPortrait() { return document.body.classList.contains('portrait'); }

  function titleSize() {
    const base = isPortrait() ? stageW * 0.12 : Math.min(stageW, stageH) * 0.09;
    return Math.max(34, Math.min(110, base));
  }

  function sizeDisc() {
    const d = 0.292 * Math.min(stageW, stageH);
    disc.style.width = d + 'px';
    disc.style.height = d + 'px';
  }

  function resize() {
    stageW = stage.clientWidth || innerWidth;
    stageH = stage.clientHeight || innerHeight;
    W = canvas.width = Math.max(320, Math.floor(stageW * scale));
    H = canvas.height = Math.max(180, Math.floor(stageH * scale));
    title.style.fontSize = titleSize() + 'px';
    const g = 0.9 * Math.min(stageW, stageH);
    glow.style.width = g + 'px';
    glow.style.height = g + 'px';
    glow.style.margin = (-g / 2) + 'px 0 0 ' + (-g / 2) + 'px';
    sizeDisc();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- visual state ----------
  let sBass = 0, hue = 260, rot = 0;
  let discOn = false;   // true when the circle style is showing a round cover in the middle

  const titleScale = () => 1 + sBass * 0.1;
  const glowOpacity = () => Math.min(1, 0.12 + sBass * 0.7);
  const glowScale = () => 0.9 + sBass * 0.35;

  // ---------- themes ----------
  const P = () => hue * Math.PI / 180;
  const THEMES = [
    { name: 'aurora',    sat: 90,  glow: '120,60,255',  t: ['#ffffff', '#b99bff'], hue: (o) => (hue + o) % 360 },
    { name: 'cyberpunk', sat: 100, glow: '255,0,170',   t: ['#ff2fd0', '#00f0ff'], hue: (o) => 322 - 140 * ((Math.sin(o * 0.08 + P()) + 1) / 2) },
    { name: 'toxic',     sat: 95,  glow: '0,255,120',   t: ['#eaffd0', '#00ff88'], hue: (o) => 110 + 40 * Math.sin(o * 0.05 + P()) },
    { name: 'inferno',   sat: 100, glow: '255,80,0',    t: ['#fff1c2', '#ff5a00'], hue: (o) => 18 + 22 * Math.sin(o * 0.05 + P()) },
    { name: 'ice',       sat: 90,  glow: '0,200,255',   t: ['#ffffff', '#2bd0ff'], hue: (o) => 200 + 25 * Math.sin(o * 0.05 + P()) },
    { name: 'mono',      sat: 0,   glow: '255,255,255', t: ['#ffffff', '#9a9a9a'], hue: () => 0 }
  ];
  let themeIdx = 0, th = THEMES[0];

  function applyTheme(i) {
    themeIdx = i % THEMES.length;
    th = THEMES[themeIdx];
    themeBtn.textContent = 'theme: ' + th.name;
    glow.style.background = `radial-gradient(circle, rgba(${th.glow},.55), rgba(${th.glow},0) 65%)`;
    title.style.setProperty('--t1', th.t[0]);
    title.style.setProperty('--t2', th.t[1]);
    title.style.setProperty('--tg', `rgba(${th.glow},.6)`);
    disc.style.setProperty('--dg', `rgba(${th.glow},.6)`);
  }
  themeBtn.addEventListener('click', () => applyTheme(themeIdx + 1));

  function col(off, l, a) {
    return `hsla(${th.hue(off)},${th.sat}%,${l}%,${a})`;
  }

  // ---------- playlist ----------
  let tracks = [];
  let index = 0;
  let shuffle = false;
  let history = [];
  let bgOn = true;

  const VID_RE = /\.(mp4|webm|mov|m4v|mkv)$/i;
  const AUD_RE = /\.(mp3|wav|ogg|m4a|flac|aac)$/i;
  const IMG_RE = /\.(png|jpe?g|webp|gif)$/i;

  // Preset beats that ship with the site. Put your files in a "beats/" folder
  // next to this file, then list the exact filenames here. (mp3 or mp4)
  // Only YOU can change this list (it's your repo), so visitors can only play what you upload.
  const AUTO_BEATS = [
    'beats/beatjelefir.mp3',
    'beats/jhele3.mp3',
    'beats/yeatbeat.mp3'
  ];

  // Optional cover image per preset (put the image in the same repo).
  // Example: 'beats/yeatbeat.mp3': 'beats/yeatbeat.jpg'
  const COVERS = {
  };

  function presetTrack(p) {
    const t = { name: p.split('/').pop().replace(/\.[^.]+$/, ''), url: p, video: VID_RE.test(p), cover: COVERS[p] || null };
    if (t.cover) loadCover(t);
    return t;
  }

  function addFiles(list) {
    const all = Array.from(list);
    const imgs = all.filter(f => f.type.startsWith('image/') || IMG_RE.test(f.name));
    const media = all.filter(f => f.type.startsWith('audio/') || f.type.startsWith('video/') || AUD_RE.test(f.name) || VID_RE.test(f.name));
    if (!imgs.length && !media.length) return;

    if (media.length) {
      const startAt = tracks.length;
      tracks = tracks.concat(media.map(f => ({
        name: f.name.replace(/\.[^.]+$/, ''),
        url: URL.createObjectURL(f),
        video: f.type.startsWith('video/') || VID_RE.test(f.name),
        cover: null
      })));
      hint.style.display = 'none';
      // if something is already playing (or recording), just add to the list without interrupting
      if (recording || (audio.getAttribute('src') && !audio.paused)) renderList();
      else loadTrack(startAt, true);
    }
    if (imgs.length && tracks.length) setCover(URL.createObjectURL(imgs[0]));
  }

  document.getElementById('files').addEventListener('change', (e) => {
    addFiles(e.target.files);
    e.target.value = '';
  });
  document.getElementById('coverFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) setCover(URL.createObjectURL(f));
    e.target.value = '';
  });

  // ---------- cover art ----------
  // Builds a soft, dimmed copy of the cover ONCE (so nothing is blurred live = no lag)
  function makeBlur(img) {
    const S = 512;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const iw = img.naturalWidth, ih = img.naturalHeight, m = Math.min(iw, ih);
    const sx = (iw - m) / 2, sy = (ih - m) / 2;
    const pad = S * 0.15;   // draw slightly oversized so blurred edges never show
    if ('filter' in g) {
      g.filter = 'blur(16px)';
      g.drawImage(img, sx, sy, m, m, -pad, -pad, S + pad * 2, S + pad * 2);
      g.filter = 'none';
    } else {
      // fallback for browsers without canvas blur: shrink then enlarge = soft
      const t = document.createElement('canvas');
      t.width = t.height = 24;
      t.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, 24, 24);
      g.imageSmoothingQuality = 'high';
      g.drawImage(t, 0, 0, S, S);
    }
    g.fillStyle = 'rgba(5,5,7,0.5)';   // dim it so the visuals pop
    g.fillRect(0, 0, S, S);
    return c;
  }

  function loadCover(tr) {
    const url = tr.cover;
    const img = new Image();
    img.onload = () => {
      if (tr.cover !== url) return;   // cover was changed or cleared while loading
      tr.coverImg = img;
      tr.bgc = makeBlur(img);
      try { tr.bgUrl = tr.bgc.toDataURL('image/jpeg', 0.85); } catch (e) { tr.bgUrl = null; }
      if (tracks[index] === tr) applyBg();
    };
    img.onerror = () => {
      console.warn('[VSLZR] Cover failed to load:', url);
      if (tr.cover === url) tr.cover = null;
    };
    img.src = url;
  }

  function dropCover(tr) {
    if (tr.cover && tr.cover.startsWith('blob:')) URL.revokeObjectURL(tr.cover);
    tr.cover = null; tr.coverImg = null; tr.bgc = null; tr.bgUrl = null;
  }

  function setCover(url) {
    const tr = tracks[index];
    if (!tr) { URL.revokeObjectURL(url); alert('Load a beat first, then set its cover.'); return; }
    dropCover(tr);
    tr.cover = url;
    loadCover(tr);
  }

  function clearCover() {
    const tr = tracks[index];
    if (!tr || !tr.cover) return;
    dropCover(tr);
    applyBg();
  }

  // decides what shows behind the visuals:
  //  - a cover (if set): blurred + dimmed background, plus a round sharp cover in the middle of the circle style
  //  - otherwise an mp4's video (dimmed)
  //  - otherwise nothing
  function applyBg() {
    const tr = tracks[index];
    const hasCover = !!(tr && tr.bgUrl && bgOn);
    const hasVideo = !!(tr && tr.video && !tr.cover && bgOn);
    audio.classList.toggle('show', hasVideo);
    if (hasCover) {
      if (coverEl.getAttribute('src') !== tr.bgUrl) coverEl.src = tr.bgUrl;
      if (disc.getAttribute('src') !== tr.cover) disc.src = tr.cover;
    }
    coverEl.classList.toggle('show', hasCover);
    discOn = hasCover && MODES[mode] === 'circle';
    disc.classList.toggle('show', discOn);
  }

  function renderList() {
    listEl.innerHTML = '';
    tracks.forEach((t, i) => {
      const d = document.createElement('div');
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = (i + 1) + '.';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = t.name;
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      x.title = 'Remove';
      x.addEventListener('click', (ev) => { ev.stopPropagation(); removeTrack(i); });
      d.append(n, nm, x);
      if (i === index) d.className = 'on';
      d.addEventListener('click', () => loadTrack(i, true));
      listEl.appendChild(d);
    });
  }

  function loadTrack(i, autoplay) {
    if (recording) return;
    index = (i + tracks.length) % tracks.length;
    audio.src = tracks[index].url;
    trackName.textContent = tracks[index].name.toUpperCase();
    applyBg();
    renderList();
    if (autoplay) startPlayback();
  }

  function removeTrack(i) {
    if (recording) return;
    const t = tracks[i];
    if (!t) return;
    const wasCurrent = (i === index);
    const wasPlaying = !audio.paused;
    if (t.url.startsWith('blob:')) URL.revokeObjectURL(t.url);
    dropCover(t);
    tracks.splice(i, 1);
    history = [];   // shuffle history indexes are no longer valid

    if (!tracks.length) {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      index = 0;
      trackName.textContent = '';
      seek.value = 0;
      hint.style.display = '';
      applyBg();
      renderList();
      return;
    }
    if (wasCurrent) { loadTrack(i % tracks.length, wasPlaying); return; }
    if (i < index) index--;
    renderList();
  }

  function randomIndex() {
    if (tracks.length < 2) return index;
    let r;
    do { r = Math.floor(Math.random() * tracks.length); } while (r === index);
    return r;
  }

  function goNext() {
    if (!tracks.length) return;
    if (shuffle) {
      history.push(index);
      if (history.length > 50) history.shift();
      loadTrack(randomIndex(), true);
    } else {
      loadTrack(index + 1, true);
    }
  }

  function goPrev() {
    if (!tracks.length) return;
    if (shuffle && history.length) loadTrack(history.pop(), true);
    else loadTrack(index - 1, true);
  }

  function toggleShuffle() {
    shuffle = !shuffle;
    shuffleBtn.classList.toggle('on', shuffle);
    shuffleBtn.textContent = shuffle ? 'Shuffle: on' : 'Shuffle';
  }

  // ---------- presets ----------
  let presetCycle = -1;
  function playPresets() {
    if (!AUTO_BEATS.length) { alert('No presets configured. Add files to the AUTO_BEATS list.'); return; }
    // Re-add any preset that was removed
    const present = new Set(tracks.map(t => t.url));
    AUTO_BEATS.forEach(url => {
      if (!present.has(url)) tracks.push(presetTrack(url));
    });
    presetCycle = (presetCycle + 1) % AUTO_BEATS.length;
    const target = AUTO_BEATS[presetCycle];
    const idx = tracks.findIndex(t => t.url === target);
    if (idx >= 0) { hint.style.display = 'none'; loadTrack(idx, true); }
  }
  presetsBtn.addEventListener('click', playPresets);

  if (AUTO_BEATS.length) {
    tracks = AUTO_BEATS.map(presetTrack);
    hint.textContent = 'PICK A BEAT TO BEGIN';
    renderList();
    console.log('[VSLZR] Loaded', AUTO_BEATS.length, 'preset(s):', AUTO_BEATS);
  }

  // Quietly verify each preset actually exists and is playable
  (async function verifyPresets() {
    let ok = 0, fail = 0;
    for (const url of AUTO_BEATS) {
      const good = await new Promise(resolve => {
        const a = new Audio();
        a.preload = 'metadata';
        const t = setTimeout(() => resolve(false), 5000);
        a.onloadedmetadata = () => { clearTimeout(t); resolve(true); };
        a.onerror = () => { clearTimeout(t); resolve(false); };
        a.src = url;
      });
      if (good) ok++;
      else { fail++; console.warn('[VSLZR] ⚠ Preset missing or unplayable:', url); }
    }
    if (AUTO_BEATS.length) console.log(`[VSLZR] Preset check: ${ok} OK, ${fail} missing`);
  })();

  // ---------- audio analysis ----------
  let audioCtx, analyser, gainNode, recDest, freq, wave;
  let vol = 1;

  function setupAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.8;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = vol;
    recDest = audioCtx.createMediaStreamDestination();
    // volume is applied AFTER the analyser, so visuals (and recordings) stay full at any volume
    src.connect(analyser);
    analyser.connect(gainNode);
    analyser.connect(recDest);
    gainNode.connect(audioCtx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
  }

  function startPlayback() {
    hint.style.display = 'none';
    setupAudio();
    audioCtx.resume();
    audio.play().catch(err => {
      console.warn('[VSLZR] Play failed:', err.name, '— src:', audio.getAttribute('src'));
    });
  }

  function togglePlay() {
    if (!tracks.length || recording) return;
    if (!audio.getAttribute('src')) { loadTrack(index, true); return; }
    if (audio.paused) startPlayback(); else audio.pause();
  }

  // ---------- recording ----------
  let RW = 1280, RH = 720;
  const rec = document.createElement('canvas');
  rec.width = RW; rec.height = RH;
  const rctx = rec.getContext('2d');
  let recording = false, recorder = null, recChunks = [], recStart = 0, recName = '', recStopTimer = null, lastRecDraw = 0;

  function pickMime() {
    const list = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    return list.find(m => MediaRecorder.isTypeSupported(m)) || '';
  }

  function startRecording() {
    if (!tracks.length || recording) return;
    if (!window.MediaRecorder) { alert('This browser cannot record. Use Chrome.'); return; }
    setupAudio();
    audioCtx.resume();
    if (!audio.getAttribute('src')) audio.src = tracks[index].url;
    trackName.textContent = tracks[index].name.toUpperCase();

    // recording size follows the format button (16:9 or 9:16)
    RW = isPortrait() ? 720 : 1280;
    RH = isPortrait() ? 1280 : 720;
    rec.width = RW; rec.height = RH;

    const stream = rec.captureStream(30);
    recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const mime = pickMime();
    const opts = { videoBitsPerSecond: 5000000 };
    if (mime) opts.mimeType = mime;
    recChunks = [];
    recorder = new MediaRecorder(stream, opts);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = saveRecording;

    recName = tracks[index].name;
    audio.currentTime = 0;
    recording = true;
    recStart = performance.now();
    recorder.start(1000);
    startPlayback();
    recBtn.classList.add('rec');
    recBtn.textContent = '■ 0:00';
  }

  function stopRecording() {
    if (!recording) return;
    clearTimeout(recStopTimer);
    recording = false;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  }

  function saveRecording() {
    const blob = new Blob(recChunks, { type: (recorder && recorder.mimeType) || 'video/webm' });
    const base = (recName || '').replace(/[^\w\- ]+/g, '').trim() || 'beat';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + ' - VSLZR' + (RH > RW ? ' (9x16)' : '') + '.webm';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    recBtn.classList.remove('rec');
    recBtn.innerHTML = '&#9679; Record';
  }

  recBtn.addEventListener('click', () => { if (recording) stopRecording(); else startRecording(); });

  // draws a video/image so it fills the whole box (like CSS object-fit: cover)
  function drawCoverFit(c, el, sw, sh, dx, dy, dw, dh, alpha) {
    const sr = sw / sh, dr = dw / dh;
    let cw = sw, ch = sh, cx = 0, cy = 0;
    if (sr > dr) { cw = sh * dr; cx = (sw - cw) / 2; }
    else { ch = sw / dr; cy = (sh - ch) / 2; }
    c.globalAlpha = alpha;
    c.drawImage(el, cx, cy, cw, ch, dx, dy, dw, dh);
    c.globalAlpha = 1;
  }

  function drawRecBg() {
    const tr = tracks[index];
    if (!bgOn || !tr) return;
    if (tr.bgc) {
      drawCoverFit(rctx, tr.bgc, tr.bgc.width, tr.bgc.height, 0, 0, RW, RH, 1);
    } else if (tr.video && !tr.cover && audio.videoWidth) {
      drawCoverFit(rctx, audio, audio.videoWidth, audio.videoHeight, 0, 0, RW, RH, 0.42);
    }
  }

  // draws one frame: background + glow + visuals + cover disc + title (the page's buttons are NOT included)
  function drawRecFrame(now) {
    if (now - lastRecDraw < 33) return;
    lastRecDraw = now;

    rctx.globalAlpha = 1;
    rctx.fillStyle = '#050507';
    rctx.fillRect(0, 0, RW, RH);

    drawRecBg();

    const s = Math.min(RW / canvas.width, RH / canvas.height);
    const dw = canvas.width * s, dh = canvas.height * s;
    const dx = (RW - dw) / 2, dy = (RH - dh) / 2;
    const k = dw / stageW;

    // glow
    const gx = RW / 2, gy = dy + dh * CY;
    const Rg = 0.45 * Math.min(dw, dh) * 1.414 * glowScale();
    const g = rctx.createRadialGradient(gx, gy, 0, gx, gy, Rg);
    g.addColorStop(0, `rgba(${th.glow},.55)`);
    g.addColorStop(0.65, `rgba(${th.glow},0)`);
    rctx.globalAlpha = glowOpacity();
    rctx.fillStyle = g;
    rctx.fillRect(0, 0, RW, RH);
    rctx.globalAlpha = 1;

    // visuals
    rctx.drawImage(canvas, dx, dy, dw, dh);

    // round cover in the middle (circle style only)
    const tr = tracks[index];
    if (discOn && tr && tr.coverImg) {
      const rad = 0.146 * Math.min(stageW, stageH) * k * (1 + sBass * 0.12);
      const cxr = RW / 2, cyr = dy + dh * CY;
      const iw = tr.coverImg.naturalWidth, ih = tr.coverImg.naturalHeight, m = Math.min(iw, ih);
      rctx.save();
      rctx.translate(cxr, cyr);
      rctx.rotate(rot * 0.4);
      rctx.beginPath();
      rctx.arc(0, 0, rad, 0, Math.PI * 2);
      rctx.clip();
      rctx.drawImage(tr.coverImg, (iw - m) / 2, (ih - m) / 2, m, m, -rad, -rad, rad * 2, rad * 2);
      rctx.restore();
      rctx.strokeStyle = `rgba(${th.glow},.6)`;
      rctx.lineWidth = Math.max(2, 3 * k);
      rctx.beginPath();
      rctx.arc(cxr, cyr, rad, 0, Math.PI * 2);
      rctx.stroke();
    }

    // title (same look as the page: bold, gradient, glow)
    const fs = titleSize() * k;
    const ls = 0.22 * fs;
    const ty = dy + dh * 0.09;
    const sc = titleScale();
    rctx.save();
    rctx.translate(RW / 2 + ls / 2, ty);
    rctx.scale(sc, sc);
    rctx.font = `800 ${fs}px "Segoe UI", "Helvetica Neue", Arial, sans-serif`;
    if ('letterSpacing' in rctx) rctx.letterSpacing = ls + 'px';
    rctx.textAlign = 'center';
    rctx.textBaseline = 'middle';
    const tw = rctx.measureText('VSLZR').width;
    const grd = rctx.createLinearGradient(-tw / 2, 0, tw / 2, 0);
    grd.addColorStop(0, th.t[0]);
    grd.addColorStop(1, th.t[1]);
    rctx.fillStyle = grd;
    rctx.shadowColor = `rgba(${th.glow},.6)`;
    rctx.shadowBlur = 18 * k;
    rctx.fillText('VSLZR', 0, 0);
    rctx.restore();
  }

  // ---------- controls ----------
  playBtn.addEventListener('click', togglePlay);
  document.getElementById('next').addEventListener('click', goNext);
  document.getElementById('prev').addEventListener('click', goPrev);
  shuffleBtn.addEventListener('click', toggleShuffle);
  document.getElementById('fs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  volEl.addEventListener('input', () => {
    vol = parseFloat(volEl.value);
    if (gainNode) gainNode.gain.value = vol;
  });

  // 16:9 / 9:16
  fmtBtn.addEventListener('click', () => {
    if (recording) return;
    document.body.classList.toggle('portrait');
    fmtBtn.textContent = isPortrait() ? '9:16' : '16:9';
    resize();
    ctx.clearRect(0, 0, W, H);
  });

  audio.addEventListener('play', () => playBtn.textContent = 'Pause');
  audio.addEventListener('pause', () => playBtn.textContent = 'Play');
  audio.addEventListener('error', () => {
    const e = audio.error;
    if (!e) return;
    const reasons = { 1: 'aborted', 2: 'network error', 3: 'decode error', 4: 'source not supported' };
    const src = (audio.getAttribute('src') || '').split('/').pop() || '?';
    trackName.textContent = '⚠ ' + src + ' — ' + (reasons[e.code] || 'failed to load');
    console.warn('[VSLZR] Audio error:', e.code, reasons[e.code], '→', audio.src);
  });
  audio.addEventListener('ended', () => {
    if (recording) {
      clearTimeout(recStopTimer);
      recStopTimer = setTimeout(stopRecording, 700);   // small tail so the ending isn't cut
      return;
    }
    goNext();
  });
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 1000;
    if (recording) {
      const s = Math.floor((performance.now() - recStart) / 1000);
      recBtn.textContent = '■ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }
  });
  seek.addEventListener('input', () => {
    if (recording) return;
    if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
  });

  // modes (bars first = default)
  const MODES = ['bars', 'wave', 'circle', 'tunnel'];
  let mode = 0;
  function setMode(i) {
    mode = i % MODES.length;
    modeBtn.textContent = MODES[mode];
    ctx.clearRect(0, 0, W, H);
    applyBg();
  }
  modeBtn.addEventListener('click', () => setMode(mode + 1));

  // keyboard
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'm' || e.key === 'M') setMode(mode + 1);
    else if (e.key === 't' || e.key === 'T') applyTheme(themeIdx + 1);
    else if (e.key === 's' || e.key === 'S') toggleShuffle();
    else if (e.key === 'v' || e.key === 'V') { bgOn = !bgOn; applyBg(); }
    else if (e.key === 'c' || e.key === 'C') clearCover();
    else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
    else if (e.key >= '1' && e.key <= '9' && tracks[Number(e.key) - 1]) loadTrack(Number(e.key) - 1, true);
    else if (e.code === 'ArrowRight' && tracks.length && !recording) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    else if (e.code === 'ArrowLeft' && tracks.length && !recording) audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
  document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.blur()));

  // drag & drop
  let dragDepth = 0;
  addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) document.body.classList.remove('dragging');
  });
  addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ---------- drawing helpers ----------
  // draws grouped line segments in 2 passes (soft glow + bright core)
  function strokeGroups(groups, u) {
    ctx.lineCap = 'round';
    for (let g = 0; g < groups.length; g++) {
      const pts = groups[g];
      if (!pts.length) continue;
      ctx.beginPath();
      for (let k = 0; k < pts.length; k += 4) {
        ctx.moveTo(pts[k], pts[k + 1]);
        ctx.lineTo(pts[k + 2], pts[k + 3]);
      }
      ctx.strokeStyle = col(g * 40, 55, 0.22);
      ctx.lineWidth = u * 0.014;
      ctx.stroke();
      ctx.strokeStyle = col(g * 40, 75, 0.95);
      ctx.lineWidth = u * 0.004 + 1;
      ctx.stroke();
    }
  }

  // ----- BARS -----
  const BN = 48;
  const barH = new Float32Array(BN);
  const peaks = new Float32Array(BN);

  function drawBars() {
    const base = H * 0.74, bw = W / (BN * 2), usable = freq.length * 0.5;
    for (let i = 0; i < BN; i++) {
      const v = freq[Math.floor(i / BN * usable)] / 255;
      barH[i] = Math.max(v, barH[i] * 0.92);                 // rise fast, fall smooth
      peaks[i] = Math.max(barH[i], peaks[i] - 0.006);         // peak cap drops slowly
      const h = barH[i] * H * 0.48 + 2;
      const ph = peaks[i] * H * 0.48 + 4;
      const off = i * 2.5;
      const xr = W / 2 + i * bw;
      const xl = W / 2 - (i + 1) * bw;

      ctx.fillStyle = col(off, 60, 0.9);
      ctx.fillRect(xr + 1, base - h, bw - 2, h);
      ctx.fillRect(xl + 1, base - h, bw - 2, h);

      ctx.fillStyle = col(off, 60, 0.18);                     // reflection
      ctx.fillRect(xr + 1, base, bw - 2, h * 0.45);
      ctx.fillRect(xl + 1, base, bw - 2, h * 0.45);

      ctx.fillStyle = col(off, 88, 0.9);                      // peak cap
      ctx.fillRect(xr + 1, base - ph - 4, bw - 2, 2);
      ctx.fillRect(xl + 1, base - ph - 4, bw - 2, 2);
    }
  }

  // ----- WAVE -----
  function drawWave() {
    analyser.getByteTimeDomainData(wave);
    const u = Math.min(W, H), cy = H * CY, amp = u * 0.24 * (1 + sBass * 0.3);
    const n = 256, step = wave.length / n;
    ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      const sign = pass === 0 ? 1 : -1;      // second pass = faint mirrored echo
      const a = pass === 0 ? 1 : 0.35;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const v = (wave[Math.floor(i * step)] - 128) / 128;
        const x = (i / (n - 1)) * W;
        const y = cy + sign * v * amp;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.strokeStyle = col(0, 55, 0.25 * a);
      ctx.lineWidth = u * 0.02;
      ctx.stroke();
      ctx.strokeStyle = col(40, 75, 0.95 * a);
      ctx.lineWidth = u * 0.005 + 1;
      ctx.stroke();
    }
  }

  // ----- CIRCLE -----
  // with a cover: bigger ring around the round cover (no inner bars / waveform, so nothing overlaps it)
  function drawCircle() {
    const cx = W / 2, cy = H * CY, u = Math.min(W, H);
    const r = u * (discOn ? 0.17 : 0.15) * (1 + sBass * (discOn ? 0.12 : 0.18));
    rot += 0.003 + sBass * 0.012;

    const bars = 96, half = 48, usable = freq.length * 0.55;
    const outer = [[], [], []];
    const inner = [[], [], []];
    for (let i = 0; i < bars; i++) {
      const j = i < half ? i : bars - 1 - i;
      let v = freq[Math.floor(j / half * usable)] / 255;
      v = Math.min(1, v * (1 + (j / half) * 0.8));            // boost highs so the ring looks fuller
      const a = (i / bars) * Math.PI * 2 - Math.PI / 2 + rot;
      const c = Math.cos(a), s = Math.sin(a);
      const g = j < 12 ? 0 : j < 30 ? 1 : 2;

      const lenOut = v * u * (discOn ? 0.14 : 0.16) + 2;
      outer[g].push(cx + c * r, cy + s * r, cx + c * (r + lenOut), cy + s * (r + lenOut));

      if (!discOn) {
        const rIn = r - u * 0.012;
        const lenIn = v * u * 0.07 + 1;
        inner[g].push(cx + c * rIn, cy + s * rIn, cx + c * (rIn - lenIn), cy + s * (rIn - lenIn));
      }
    }
    strokeGroups(outer, u);

    if (discOn) {
      // thin bright ring hugging the cover
      ctx.strokeStyle = col(60, 75, 0.9);
      ctx.lineWidth = u * 0.003 + 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      analyser.getByteTimeDomainData(wave);
      strokeGroups(inner, u * 0.6);

      // soft breathing disc in the middle
      const rw = r - u * 0.03;
      ctx.fillStyle = col(0, 60, 0.05 + sBass * 0.12);
      ctx.beginPath();
      ctx.arc(cx, cy, rw * 0.92, 0, Math.PI * 2);
      ctx.fill();

      // live waveform ring
      const pts = 128, wstep = wave.length / pts;
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const k = i % pts;
        const v = (wave[Math.floor(k * wstep)] - 128) / 128;
        const a = (k / pts) * Math.PI * 2 - rot * 1.5;
        const rr = rw + v * u * 0.035;
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = col(60, 75, 0.9);
      ctx.lineWidth = u * 0.003 + 1;
      ctx.stroke();
    }

    // outer ring of dots, rotating the other way
    const R2 = r + u * (discOn ? 0.17 : 0.2) + sBass * u * 0.02;
    const ds = Math.max(2, u * 0.004);
    ctx.fillStyle = col(120, 70, 0.55);
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI * 2 - rot * 0.5;
      ctx.fillRect(cx + Math.cos(a) * R2, cy + Math.sin(a) * R2, ds, ds);
    }
  }

  // ----- TUNNEL (mirrored rings rushing at you, warped by the frequencies) -----
  const TN = 14;
  const tz = new Float32Array(TN);
  for (let i = 0; i < TN; i++) tz[i] = i / TN;
  let trot = 0;

  function drawTunnel() {
    const cx = W / 2, cy = H * CY, u = Math.min(W, H);
    const speed = 0.0035 + sBass * 0.02;
    const maxR = Math.hypot(W, H) * 0.55;
    const verts = 64, half = 32, usable = freq.length * 0.45;
    trot += 0.002 + sBass * 0.004;

    // spectrum value for each half of the ring (mirrored left/right)
    const vs = new Float32Array(half + 1);
    for (let j = 0; j <= half; j++) vs[j] = freq[Math.floor(j / half * usable)] / 255;

    ctx.lineJoin = 'round';
    for (let i = 0; i < TN; i++) {
      tz[i] += speed;
      if (tz[i] > 1) tz[i] -= 1;
      const z = tz[i];
      const r = maxR * Math.pow(z, 2.2);
      if (r < 2) continue;
      const fade = Math.min(1, z / 0.15) * (1 - Math.max(0, (z - 0.85) / 0.15));

      ctx.beginPath();
      for (let k = 0; k <= verts; k++) {
        const kk = k % verts;
        const j = kk <= half ? kk : verts - kk;
        const a = (kk / verts) * Math.PI * 2 - Math.PI / 2 + trot;
        const rr = r * (1 + vs[j] * 0.35 * z);
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr;
        if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = col(z * 120 + i * 8, 55, 0.14 * fade);
      ctx.lineWidth = u * 0.006 + z * u * 0.03;
      ctx.stroke();
      ctx.strokeStyle = col(z * 120 + i * 8, 75, 0.85 * fade);
      ctx.lineWidth = u * 0.0015 + z * u * 0.007;
      ctx.stroke();
    }

    // glowing vanishing point in the middle
    ctx.fillStyle = col(0, 70, 0.25 + sBass * 0.4);
    ctx.beginPath();
    ctx.arc(cx, cy, u * 0.012 * (1 + sBass * 2), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- auto quality ----------
  let fCount = 0, fLast = performance.now();
  function checkPerf() {
    if (++fCount < 90) return;
    const now = performance.now(), dt = now - fLast;
    fCount = 0; fLast = now;
    if (document.hidden || dt > 4000) return;
    if (90000 / dt < 40 && scale > 0.4) { scale *= 0.8; resize(); }
  }

  // ---------- main loop ----------
  function draw() {
    requestAnimationFrame(draw);

    // fade old frame toward transparent (gives trails, keeps glow and background visible)
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    if (!analyser) return;
    const now = performance.now();
    if (!audio.paused) checkPerf();

    analyser.getByteFrequencyData(freq);

    let b = 0;
    for (let i = 0; i < 8; i++) b += freq[i];
    const bass = b / (8 * 255);
    sBass += (bass - sBass) * 0.25;
    hue = (hue + 0.2 + sBass * 1.2) % 360;

    if (mode === 0) drawBars();
    else if (mode === 1) drawWave();
    else if (mode === 2) drawCircle();
    else drawTunnel();

    if (recording) drawRecFrame(now);

    title.style.transform = `translate(-50%,-50%) scale(${titleScale()})`;
    glow.style.opacity = glowOpacity();
    glow.style.transform = `scale(${glowScale()})`;
    if (discOn) disc.style.transform = `translate(-50%,-50%) rotate(${rot * 0.4}rad) scale(${1 + sBass * 0.12})`;
  }

  applyTheme(0);
  draw();
</script>
</body>
</html>
